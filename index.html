<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Pintar - Aplikasi Pencatat Kegiatan</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Konfigurasi Tailwind Kustom -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        secondary: '#10b981', // Emerald 500
                        dark: '#1e293b', // Slate 800
                        light: '#f8fafc', // Slate 50
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom Styles & Animations */
        body {
            background-color: #e2e8f0; /* Latar belakang luar (abu-abu muda) */
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Container menyerupai tampilan mobile app */
        #app-container {
            width: 100%;
            max-width: 480px; /* Lebar maksimal ala HP */
            background-color: #f8fafc; /* light */
            min-height: 100vh;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Glassmorphism Header */
        .glass-header {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            border-bottom-left-radius: 2rem;
            border-bottom-right-radius: 2rem;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
            position: relative;
            z-index: 10;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Hide scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        
        .slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Modal Overlay */
        #modal-overlay {
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        /* Custom Checkbox Style */
        .task-checkbox:checked + div {
            background-color: #10b981;
            border-color: #10b981;
        }
        .task-checkbox:checked + div svg {
            display: block;
        }
        
        /* Smooth transitions for task items */
        .task-item {
            transition: all 0.3s ease;
        }
        .task-completed .task-title {
            text-decoration: line-through;
            color: #94a3b8; /* text-slate-400 */
        }
        .task-completed {
            opacity: 0.7;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-200">

    <!-- App Container -->
    <div id="app-container">
        
        <!-- Header & Dashboard Stats -->
        <header class="glass-header px-6 pt-10 pb-8 text-white">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight" id="greeting">Halo, Semangat! 👋</h1>
                    <p class="text-indigo-200 text-sm mt-1 font-medium" id="current-date">Memuat tanggal...</p>
                </div>
                <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-md border border-white/30 shadow-inner">
                    <i data-lucide="user" class="text-white w-6 h-6"></i>
                </div>
            </div>

            <!-- Progress Card -->
            <div class="glass-card rounded-2xl p-5 mt-2" id="progress-card">
                <div class="flex justify-between items-end mb-2">
                    <div>
                        <p class="text-indigo-200 text-xs font-semibold uppercase tracking-wider mb-1">Progres Hari Ini</p>
                        <div class="flex items-baseline gap-1">
                            <span class="text-3xl font-bold" id="progress-percentage">0%</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-indigo-100 text-sm font-medium"><span id="completed-count">0</span> dari <span id="total-count">0</span> selesai</p>
                    </div>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-black/20 h-2.5 rounded-full overflow-hidden mt-3 shadow-inner">
                    <div id="progress-bar-fill" class="bg-gradient-to-r from-emerald-300 to-emerald-400 h-full rounded-full transition-all duration-1000 ease-out w-0 relative">
                        <div class="absolute inset-0 bg-white/30 w-full animate-pulse"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content (Scrollable) -->
        <main class="flex-1 overflow-y-auto no-scrollbar pb-28 px-5 pt-6 space-y-6" id="main-content">
            <!-- Content will be injected here by JS based on Active Tab -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-slate-200 px-6 py-3 pb-safe z-20 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] rounded-t-3xl">
            <div class="flex justify-between items-center relative">
                <!-- Tab: Hari Ini -->
                <button onclick="switchTab('today')" class="nav-btn flex flex-col items-center gap-1 p-2 text-indigo-600 transition-colors" data-tab="today">
                    <i data-lucide="sun" class="w-6 h-6"></i>
                    <span class="text-[10px] font-semibold">Hari Ini</span>
                </button>
                
                <!-- Tab: Mendatang -->
                <button onclick="switchTab('upcoming')" class="nav-btn flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-indigo-500 transition-colors mr-8" data-tab="upcoming">
                    <i data-lucide="calendar-days" class="w-6 h-6"></i>
                    <span class="text-[10px] font-semibold">Mendatang</span>
                </button>

                <!-- Floating Add Button (Center) -->
                <button onclick="openModal()" class="absolute left-1/2 -top-8 -translate-x-1/2 w-16 h-16 bg-gradient-to-tr from-indigo-600 to-indigo-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-indigo-500/40 hover:scale-105 active:scale-95 transition-all border-4 border-white z-30">
                    <i data-lucide="plus" class="w-8 h-8"></i>
                </button>

                <!-- Tab: Riwayat -->
                <button onclick="switchTab('history')" class="nav-btn flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-indigo-500 transition-colors ml-8" data-tab="history">
                    <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                    <span class="text-[10px] font-semibold">Riwayat</span>
                </button>

                <!-- Tab: Statistik -->
                <button onclick="switchTab('stats')" class="nav-btn flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-indigo-500 transition-colors" data-tab="stats">
                    <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
                    <span class="text-[10px] font-semibold">Statistik</span>
                </button>
            </div>
        </nav>

        <!-- Modal Tambah Tugas -->
        <div id="add-modal" class="fixed inset-0 z-50 flex items-end justify-center hidden">
            <!-- Overlay background -->
            <div id="modal-overlay" class="absolute inset-0 bg-slate-900/40" onclick="closeModal()"></div>
            
            <!-- Modal Content (Bottom Sheet Style) -->
            <div id="modal-content" class="bg-white w-full max-w-md rounded-t-[2rem] p-6 relative z-10 transform translate-y-full transition-transform duration-300 shadow-2xl">
                <!-- Handle bar for visual cue -->
                <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
                
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-slate-800">Tambah Jadwal Baru</h2>
                    <button onclick="closeModal()" class="p-2 bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <form id="task-form" onsubmit="handleAddTask(event)" class="space-y-4">
                    <!-- Judul -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Judul Kegiatan *</label>
                        <input type="text" id="task-title" required placeholder="Misal: Rapat Proyek Website" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <!-- Tanggal -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Tanggal</label>
                            <input type="date" id="task-date" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700">
                        </div>
                        <!-- Waktu -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Waktu</label>
                            <input type="time" id="task-time" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <!-- Kategori -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Kategori</label>
                            <select id="task-category" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none appearance-none text-slate-700">
                                <option value="Kerja">💼 Kerja</option>
                                <option value="Pribadi">👤 Pribadi</option>
                                <option value="Belajar">📚 Belajar</option>
                                <option value="Kesehatan">🏃 Kesehatan</option>
                                <option value="Lainnya">📌 Lainnya</option>
                            </select>
                        </div>
                        <!-- Prioritas -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Prioritas</label>
                            <select id="task-priority" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none appearance-none text-slate-700">
                                <option value="Biasa">🟢 Biasa</option>
                                <option value="Penting">🟡 Penting</option>
                                <option value="Mendesak">🔴 Mendesak</option>
                            </select>
                        </div>
                    </div>

                    <!-- Catatan -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">Catatan (Opsional)</label>
                        <textarea id="task-notes" rows="2" placeholder="Tambahkan detail jika perlu..." class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none resize-none transition-all placeholder:text-slate-400"></textarea>
                    </div>

                    <!-- Tombol Simpan -->
                    <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-[0.98] mt-2 flex justify-center items-center gap-2">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        Simpan Jadwal
                    </button>
                </form>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- State Management ---
        let tasks = JSON.parse(localStorage.getItem('jadwalTasks')) || [];
        let currentTab = 'today';
        const todayString = new Date().toLocaleDateString('en-CA'); // Format YYYY-MM-DD

        // Inisialisasi awal
        document.addEventListener('DOMContentLoaded', () => {
            // Set tanggal hari ini di form
            document.getElementById('task-date').value = todayString;
            
            // Set format jam (default jam saat ini + 1 jam)
            const now = new Date();
            now.setHours(now.getHours() + 1);
            document.getElementById('task-time').value = now.toTimeString().slice(0, 5);

            // Tampilkan tanggal di header
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', options);

            // Render view pertama kali
            renderView();
            lucide.createIcons();
        });

        // --- Core Functions ---

        // Fungsi Simpan ke Local Storage
        function saveTasks() {
            localStorage.setItem('jadwalTasks', JSON.stringify(tasks));
            renderView();
        }

        // Handle Form Submit (Tambah Tugas)
        function handleAddTask(e) {
            e.preventDefault();
            
            const title = document.getElementById('task-title').value.trim();
            const date = document.getElementById('task-date').value;
            const time = document.getElementById('task-time').value;
            const category = document.getElementById('task-category').value;
            const priority = document.getElementById('task-priority').value;
            const notes = document.getElementById('task-notes').value.trim();

            if (!title) return;

            const newTask = {
                id: Date.now().toString(),
                title,
                date,
                time,
                category,
                priority,
                notes,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.push(newTask);
            saveTasks();
            closeModal();
            
            // Reset form
            e.target.reset();
            document.getElementById('task-date').value = todayString; // kembalikan ke default

            // Pindah ke tab yang sesuai jika nambah tugas untuk besok, pindah ke tab mendatang
            if(date > todayString) {
                switchTab('upcoming');
            } else if (date === todayString) {
                switchTab('today');
            }
        }

        // Toggle Status Selesai
        function toggleTaskStatus(taskId) {
            const taskIndex = tasks.findIndex(t => t.id === taskId);
            if (taskIndex !== -1) {
                tasks[taskIndex].completed = !tasks[taskIndex].completed;
                saveTasks();
            }
        }

        // Hapus Tugas
        function deleteTask(taskId) {
            if(confirm("Apakah kamu yakin ingin menghapus jadwal ini?")) {
                tasks = tasks.filter(t => t.id !== taskId);
                saveTasks();
            }
        }

        // --- UI & Rendering ---

        // Ganti Tab Navbar
        function switchTab(tabName) {
            currentTab = tabName;
            
            // Update UI Button
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const icon = btn.querySelector('i');
                const text = btn.querySelector('span');
                
                if (btn.dataset.tab === tabName) {
                    btn.classList.remove('text-slate-400');
                    btn.classList.add('text-indigo-600');
                } else {
                    btn.classList.remove('text-indigo-600');
                    btn.classList.add('text-slate-400');
                }
            });

            // Sembunyikan/Tampilkan Header Progress tergantung tab
            const headerObj = document.querySelector('.glass-header');
            const progressCard = document.getElementById('progress-card');
            
            if (tabName === 'today') {
                progressCard.style.display = 'block';
                headerObj.classList.add('pb-8');
                headerObj.classList.remove('pb-6');
            } else {
                progressCard.style.display = 'none';
                headerObj.classList.remove('pb-8');
                headerObj.classList.add('pb-6');
            }

            renderView();
        }

        // Render Konten Berdasarkan Tab Aktif
        function renderView() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = ''; // Kosongkan dulu
            
            updateProgressHeader(); // Selalu update kalkulasi progress

            let filteredTasks = [];
            let viewTitle = "";

            // Sorting logic: Belum selesai di atas, urut berdasarkan jam
            const sortTasks = (a, b) => {
                if(a.completed !== b.completed) return a.completed ? 1 : -1;
                return a.time.localeCompare(b.time);
            };

            switch (currentTab) {
                case 'today':
                    viewTitle = "Jadwal Hari Ini";
                    filteredTasks = tasks.filter(t => t.date === todayString).sort(sortTasks);
                    break;
                case 'upcoming':
                    viewTitle = "Jadwal Mendatang";
                    // Tampilkan tugas yang tanggalnya besok atau lebih
                    filteredTasks = tasks.filter(t => t.date > todayString && !t.completed).sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
                    break;
                case 'history':
                    viewTitle = "Riwayat Selesai";
                    // Tampilkan semua yang sudah completed, urut dari yang paling baru selesai (atau tanggal kegiatan)
                    filteredTasks = tasks.filter(t => t.completed).sort((a,b) => b.date.localeCompare(a.date));
                    break;
                case 'stats':
                    renderStats(mainContent);
                    lucide.createIcons();
                    return; // Keluar, karena stats punya render sendiri
            }

            // --- Render Judul Tab ---
            const headerHTML = `
                <div class="flex justify-between items-center mb-4 fade-in">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        ${viewTitle}
                        <span class="bg-indigo-100 text-indigo-700 text-xs py-0.5 px-2 rounded-full font-bold">${filteredTasks.length}</span>
                    </h2>
                </div>
            `;
            mainContent.insertAdjacentHTML('beforeend', headerHTML);

            // --- Render Kosong (Empty State) ---
            if (filteredTasks.length === 0) {
                const emptyMessages = {
                    'today': { icon: 'coffee', title: 'Kosong nih!', desc: 'Belum ada jadwal untuk hari ini. Waktunya bersantai atau tambah kegiatan baru.' },
                    'upcoming': { icon: 'calendar-search', title: 'Belum Ada Rencana', desc: 'Tidak ada jadwal di hari mendatang.' },
                    'history': { icon: 'ghost', title: 'Masih Sepi', desc: 'Belum ada tugas yang kamu selesaikan. Ayo semangat!' }
                };
                const msg = emptyMessages[currentTab];

                const emptyStateHTML = `
                    <div class="flex flex-col items-center justify-center py-16 px-4 text-center fade-in bg-white/50 rounded-3xl border border-slate-100 border-dashed">
                        <div class="w-20 h-20 bg-indigo-50 text-indigo-300 rounded-full flex items-center justify-center mb-4">
                            <i data-lucide="${msg.icon}" class="w-10 h-10"></i>
                        </div>
                        <h3 class="text-slate-700 font-bold text-lg mb-1">${msg.title}</h3>
                        <p class="text-slate-500 text-sm max-w-[250px]">${msg.desc}</p>
                    </div>
                `;
                mainContent.insertAdjacentHTML('beforeend', emptyStateHTML);
            } else {
                // --- Render List Tugas ---
                const listContainer = document.createElement('div');
                listContainer.className = 'space-y-3 pb-8';

                // Pisahkan grup berdasarkan tanggal jika tab 'upcoming'
                let currentDateGroup = "";

                filteredTasks.forEach((task, index) => {
                    // Tambah header tanggal untuk tab upcoming
                    if(currentTab === 'upcoming' && task.date !== currentDateGroup) {
                        currentDateGroup = task.date;
                        const dateObj = new Date(task.date);
                        const displayDate = dateObj.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' });
                        listContainer.insertAdjacentHTML('beforeend', `
                            <div class="pt-4 pb-2">
                                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">${displayDate}</span>
                            </div>
                        `);
                    }

                    listContainer.appendChild(createTaskElement(task, index));
                });

                mainContent.appendChild(listContainer);
            }

            // Inisialisasi ulang icon baru yang baru di render
            lucide.createIcons();
        }

        // Membuat Elemen Card Tugas
        function createTaskElement(task, index) {
            const div = document.createElement('div');
            
            // Konfigurasi Warna Prioritas
            let priorityColors = { badge: '', text: '' };
            if(task.priority === 'Mendesak') priorityColors = { bg: 'bg-red-50', text: 'text-red-600', ring: 'ring-red-200' };
            else if(task.priority === 'Penting') priorityColors = { bg: 'bg-amber-50', text: 'text-amber-600', ring: 'ring-amber-200' };
            else priorityColors = { bg: 'bg-emerald-50', text: 'text-emerald-600', ring: 'ring-emerald-200' };

            // Ikon Kategori
            let catIcon = 'hash';
            if(task.category === 'Kerja') catIcon = 'briefcase';
            else if(task.category === 'Pribadi') catIcon = 'user';
            else if(task.category === 'Belajar') catIcon = 'book-open';
            else if(task.category === 'Kesehatan') catIcon = 'activity';

            // Animasi masuk berurutan
            div.style.animationDelay = `${index * 0.05}s`;
            
            // Class dinamis
            const isCompleted = task.completed;
            const containerClass = `task-item bg-white p-4 rounded-2xl shadow-sm border border-slate-100 relative group slide-up ${isCompleted ? 'task-completed bg-slate-50 border-slate-200' : 'hover:shadow-md hover:border-indigo-100'}`;

            div.className = containerClass;
            div.innerHTML = `
                <div class="flex items-start gap-4">
                    <!-- Custom Checkbox -->
                    <label class="relative flex items-center justify-center cursor-pointer mt-0.5 z-10" onclick="event.stopPropagation()">
                        <input type="checkbox" class="sr-only task-checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleTaskStatus('${task.id}')">
                        <div class="w-6 h-6 border-2 border-slate-300 rounded-full flex items-center justify-center transition-all duration-200 bg-white hover:border-indigo-400 group-hover:border-indigo-400">
                            <i data-lucide="check" class="w-3.5 h-3.5 text-white hidden"></i>
                        </div>
                    </label>

                    <!-- Informasi Tugas -->
                    <div class="flex-1 min-w-0 pt-0.5">
                        <div class="flex flex-wrap items-center gap-2 mb-1.5">
                            <h3 class="task-title text-base font-bold text-slate-800 truncate transition-colors duration-200">${task.title}</h3>
                            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full ring-1 ring-inset ${priorityColors.bg} ${priorityColors.text} ${priorityColors.ring} uppercase tracking-wide">
                                ${task.priority}
                            </span>
                        </div>
                        
                        ${task.notes ? `<p class="text-sm text-slate-500 mb-3 line-clamp-2 leading-snug">${task.notes}</p>` : ''}
                        
                        <!-- Metadata Bawah -->
                        <div class="flex flex-wrap items-center gap-2 mt-2">
                            <div class="flex items-center gap-1.5 bg-slate-100 px-2 py-1 rounded-lg text-xs font-semibold ${isCompleted ? 'text-slate-400' : 'text-slate-600'}">
                                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                                <span>${task.time}</span>
                            </div>
                            <div class="flex items-center gap-1.5 bg-slate-100 px-2 py-1 rounded-lg text-xs font-semibold ${isCompleted ? 'text-slate-400' : 'text-slate-600'}">
                                <i data-lucide="${catIcon}" class="w-3.5 h-3.5"></i>
                                <span>${task.category}</span>
                            </div>
                            ${currentTab !== 'today' && currentTab !== 'upcoming' ? `
                                <div class="flex items-center gap-1.5 bg-slate-100 px-2 py-1 rounded-lg text-xs font-semibold text-slate-500">
                                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                                    <span>${task.date}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Tombol Hapus (Terlihat saat hover atau di mobile bisa ditap) -->
                    <button onclick="deleteTask('${task.id}')" class="text-slate-300 hover:text-red-500 hover:bg-red-50 p-2 rounded-xl transition-all absolute top-2 right-2 opacity-100 sm:opacity-0 group-hover:opacity-100 z-10" title="Hapus Tugas">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `;
            return div;
        }

        // Render Halaman Statistik
        function renderStats(container) {
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(t => t.completed).length;
            const pendingTasks = totalTasks - completedTasks;
            
            // Hitung kategori
            const categories = {};
            tasks.forEach(t => {
                categories[t.category] = (categories[t.category] || 0) + 1;
            });

            const html = `
                <div class="fade-in space-y-6 pb-8">
                    <h2 class="text-lg font-bold text-slate-800">Ringkasan Aktivitas</h2>
                    
                    <!-- Kartu Info Utama -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-gradient-to-br from-indigo-500 to-indigo-600 rounded-2xl p-5 text-white shadow-lg shadow-indigo-200">
                            <i data-lucide="list-todo" class="w-6 h-6 text-indigo-200 mb-2"></i>
                            <p class="text-3xl font-bold">${totalTasks}</p>
                            <p class="text-xs font-medium text-indigo-100 mt-1 uppercase tracking-wider">Total Dibuat</p>
                        </div>
                        <div class="bg-gradient-to-br from-emerald-400 to-emerald-500 rounded-2xl p-5 text-white shadow-lg shadow-emerald-200">
                            <i data-lucide="award" class="w-6 h-6 text-emerald-100 mb-2"></i>
                            <p class="text-3xl font-bold">${completedTasks}</p>
                            <p class="text-xs font-medium text-emerald-100 mt-1 uppercase tracking-wider">Diselesaikan</p>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                         <div class="flex items-center gap-3 mb-4">
                            <div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center text-amber-600">
                                <i data-lucide="clock-4" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <p class="text-sm font-bold text-slate-800">Tugas Tertunda Keseluruhan</p>
                                <p class="text-xs text-slate-500">${pendingTasks} kegiatan menunggu</p>
                            </div>
                         </div>
                    </div>

                    <!-- Distribusi Kategori -->
                    <h3 class="text-sm font-bold text-slate-700 mt-8 mb-3 uppercase tracking-wide">Distribusi Kategori</h3>
                    <div class="space-y-3">
                        ${Object.keys(categories).length === 0 ? '<p class="text-sm text-slate-400 italic">Belum ada data.</p>' : 
                            Object.entries(categories).sort((a,b)=>b[1]-a[1]).map(([cat, count]) => {
                                const percentage = Math.round((count / totalTasks) * 100);
                                return `
                                <div class="bg-white p-4 rounded-xl border border-slate-100 flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <div class="w-2 h-2 rounded-full bg-indigo-500"></div>
                                        <span class="text-sm font-semibold text-slate-700">${cat}</span>
                                    </div>
                                    <div class="flex items-center gap-4 w-1/2">
                                        <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                            <div class="bg-indigo-500 h-full rounded-full" style="width: ${percentage}%"></div>
                                        </div>
                                        <span class="text-xs font-bold text-slate-500 w-8 text-right">${count}</span>
                                    </div>
                                </div>
                                `;
                            }).join('')
                        }
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        // Update Data Progress Header (Hari Ini)
        function updateProgressHeader() {
            const todayTasks = tasks.filter(t => t.date === todayString);
            const total = todayTasks.length;
            const completed = todayTasks.filter(t => t.completed).length;
            
            let percentage = 0;
            if (total > 0) {
                percentage = Math.round((completed / total) * 100);
            }

            // Animasi angka jika ada perubahan
            document.getElementById('progress-percentage').innerText = `${percentage}%`;
            document.getElementById('completed-count').innerText = completed;
            document.getElementById('total-count').innerText = total;
            
            // Animasi Lebar Bar
            const barFill = document.getElementById('progress-bar-fill');
            barFill.style.width = `${percentage}%`;

            // Ubah warna bar berdasarkan progress
            if(percentage === 100) {
                barFill.className = "bg-gradient-to-r from-emerald-400 to-green-500 h-full rounded-full transition-all duration-1000 ease-out relative";
            } else if (percentage > 50) {
                barFill.className = "bg-gradient-to-r from-indigo-400 to-indigo-500 h-full rounded-full transition-all duration-1000 ease-out relative";
            } else {
                barFill.className = "bg-gradient-to-r from-amber-400 to-orange-400 h-full rounded-full transition-all duration-1000 ease-out relative";
            }
            if(percentage === 0) barFill.style.width = "0%";
        }


        // --- Modal Control ---
        const modal = document.getElementById('add-modal');
        const modalContent = document.getElementById('modal-content');
        
        function openModal() {
            modal.classList.remove('hidden');
            // Sedikit delay agar transisi CSS berjalan
            setTimeout(() => {
                modalContent.classList.remove('translate-y-full');
            }, 10);
        }

        function closeModal() {
            modalContent.classList.add('translate-y-full');
            // Tunggu animasi selesai sebelum menyembunyikan div
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

    </script>
</body>
</html>
